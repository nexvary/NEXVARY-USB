name: USB-USIM Lab checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 fonts-noto-core
      - run: python -m pip install -r requirements.txt
      - name: Synthetic and reported-evidence regression tests
        run: python scripts/ci_test_report.py
      - name: Offline modem recovery safety regressions on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test_modem_recovery.ps1
      - name: Checkout reviewed independent WiFi-Call engine client
        uses: actions/checkout@v4
        with:
          repository: nexvary/NEXVARY-WiFi-Call
          ref: e2ae6cfcc40279d1eb926590cb61f02c35e58aa1
          path: wifi-reference
      - name: Actual private TLS between projects with synthetic AKA
        env:
          NEXVARY_WIFI_ENGINE: ${{ github.workspace }}/wifi-reference/server/engine
        run: python scripts/check_engine_bridge.py
      - name: CLI smoke and compilation
        run: |
          python -m nexvary_usim_lab demo
          python -m nexvary_usim_lab catalog
          python -m nexvary_usim_lab diagnose
          python -m compileall -q nexvary_usim_lab scripts
      - name: GUI at 100 percent
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || 'windows' }}
          QT_SCALE_FACTOR: '1'
        run: python scripts/windows_ui_smoke.py
      - name: GUI at 125 percent
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || 'windows' }}
          QT_SCALE_FACTOR: '1.25'
        run: python scripts/windows_ui_smoke.py
      - name: GUI at 150 percent
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || 'windows' }}
          QT_SCALE_FACTOR: '1.5'
        run: python scripts/windows_ui_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: USB-Studio-UI-${{ matrix.os }}
          path: |
            ui-evidence/
            test-evidence/
            docs/RELEASE-0.8.2-AR.md
            docs/WIFI-CALL-CAPABILITY-CONTRACT.md
            nexvary_usim_lab/profiles/K3770.json
          if-no-files-found: error
  windows-exe:
    permissions:
      contents: read
      actions: read
    needs: test
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0 Pillow==11.3.0
      - run: python scripts/create_icon.py
      - name: Compile Windows portable desktop
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NEXVARY-USB-Studio --icon assets/nexvary-usb.ico --hidden-import nexvary_usim_lab.wificall_capabilities --hidden-import nexvary_usim_lab.usim_core --hidden-import nexvary_usim_lab.usim_backend --hidden-import nexvary_usim_lab.secure_bridge --add-data "nexvary_usim_lab/profiles;nexvary_usim_lab/profiles" --add-data "docs/THIRD-PARTY-REVIEW.md;docs" --add-data "licenses;licenses" --add-data "assets/fonts;assets/fonts" --add-data "assets/icons;assets/icons" launcher.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: pwsh
        run: "& 'C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe' 'installer/NEXVARY-USB.iss'"
      - name: Download previous 0.3.1 installer for actual upgrade verification
        uses: actions/download-artifact@v4
        with:
          name: NEXVARY-USB-Studio-Windows-Installer
          path: previous-installer/
          run-id: 37854171067
          github-token: ${{ github.token }}
      - name: Install, launch, upgrade, uninstall and settings preservation
        shell: pwsh
        run: ./scripts/windows_package_smoke.ps1
      - name: Versioned files and SHA256
        shell: pwsh
        run: |
          Copy-Item dist/NEXVARY-USB-Studio.exe dist/NEXVARY-USB-Studio-v0.8.2.exe
          Copy-Item installer-output/NEXVARY-USB-Studio-Setup-v0.8.2.exe dist/
          Get-ChildItem dist/*v0.8.2.exe | ForEach-Object { $h = Get-FileHash $_.FullName -Algorithm SHA256; "$($h.Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-USB-Studio-v0.8.2-Windows
          path: |
            dist/*v0.8.2.exe
            dist/SHA256SUMS.txt
            docs/RELEASE-0.8.2-AR.md
            docs/WIFI-CALL-CAPABILITY-CONTRACT.md
            nexvary_usim_lab/profiles/K3770.json
          if-no-files-found: error

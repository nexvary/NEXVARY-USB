name: USB-USIM Lab checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nexvary_usim_lab/**'
      - 'tests/**'
      - 'launcher.py'
      - 'requirements.txt'
      - '.github/workflows/usim-lab.yml'
  pull_request:
    paths:
      - 'nexvary_usim_lab/**'
      - 'tests/**'
      - 'launcher.py'
      - 'requirements.txt'
      - '.github/workflows/usim-lab.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install serial dependency
        run: python -m pip install -r requirements.txt
      - name: Mocked hardware tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Offline synthetic diagnostics
        run: python -m nexvary_usim_lab demo
      - name: Catalog smoke check
        run: python -m nexvary_usim_lab catalog
  windows-exe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Compile portable Windows app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NEXVARY-USIM-Lab launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-USIM-Lab-Windows
          path: dist/NEXVARY-USIM-Lab.exe
          if-no-files-found: error

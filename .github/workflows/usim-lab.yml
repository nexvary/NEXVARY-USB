name: USB-USIM Lab checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nexvary_usim_lab/**'
      - 'tests/**'
      - 'launcher.py'
      - 'requirements.txt'
      - 'scripts/**'
      - 'installer/**'
      - '.github/workflows/usim-lab.yml'
  pull_request:
    paths:
      - 'nexvary_usim_lab/**'
      - 'tests/**'
      - 'launcher.py'
      - 'requirements.txt'
      - 'scripts/**'
      - 'installer/**'
      - '.github/workflows/usim-lab.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install serial dependency
        run: python -m pip install -r requirements.txt
      - name: Mocked hardware tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Offline synthetic diagnostics
        run: python -m nexvary_usim_lab demo
      - name: Catalog smoke check
        run: python -m nexvary_usim_lab catalog
      - name: Compile all Python modules
        run: python -m compileall -q nexvary_usim_lab scripts
      - name: OS USB inventory smoke check
        run: python -m nexvary_usim_lab diagnose
      - name: Compile GUI and discovery
        run: python -m compileall -q nexvary_usim_lab
  windows-exe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0 Pillow==11.3.0
      - name: Generate branded application icon
        run: python scripts/create_icon.py
      - name: Windows GUI smoke
        run: python scripts/windows_ui_smoke.py
      - name: Compile branded Windows desktop
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NEXVARY-USB-Studio --icon assets/nexvary-usb.ico launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-USB-Studio-Windows-Portable
          path: dist/NEXVARY-USB-Studio.exe
          if-no-files-found: error
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compile Windows installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer/NEXVARY-USB.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-USB-Studio-Windows-Installer
          path: installer-output/NEXVARY-USB-Studio-Setup-v0.3.1.exe
          if-no-files-found: error

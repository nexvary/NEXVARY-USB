name: USB-USIM Lab checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 fonts-noto-core
      - run: python -m pip install -r requirements.txt
      - name: Synthetic and reported-evidence regression tests
        run: python scripts/ci_test_report.py
      - name: Offline modem recovery safety regressions on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test_modem_recovery.ps1
      - name: Checkout reviewed independent WiFi-Call engine client
        uses: actions/checkout@v4
        with:
          repository: nexvary/NEXVARY-WiFi-Call
          ref: b6e54c6e967044f446cb86d70eb3447ae4668f40
          path: wifi-reference
      - name: Actual private TLS between projects with synthetic AKA
        env:
          NEXVARY_WIFI_ENGINE: ${{ github.workspace }}/wifi-reference/server/engine
        run: python scripts/check_engine_bridge.py
      - name: Prepare isolated Windows driver source (no installation or signing)
        if: runner.os == 'Windows'
        run: python scripts/prepare_windows_vpcd.py windows-driver-source
      - name: CLI smoke and compilation
        run: |
          python -m nexvary_usim_lab demo
          python -m nexvary_usim_lab catalog
          python -m nexvary_usim_lab diagnose
          python -m compileall -q nexvary_usim_lab scripts
      - name: GUI at 100 percent
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || 'windows' }}
          QT_SCALE_FACTOR: '1'
        run: python scripts/windows_ui_smoke.py
      - name: GUI at 125 percent
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || 'windows' }}
          QT_SCALE_FACTOR: '1.25'
        run: python scripts/windows_ui_smoke.py
      - name: GUI at 150 percent
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || 'windows' }}
          QT_SCALE_FACTOR: '1.5'
        run: python scripts/windows_ui_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: USB-Studio-UI-${{ matrix.os }}
          path: |
            ui-evidence/
            test-evidence/
            docs/RELEASE-0.10.1-AR.md
            docs/VIRTUAL-SIM-READER-AR.md
            docs/VIRTUAL-SIM-COMPATIBILITY.md
            docs/WIFI-CALL-CAPABILITY-CONTRACT.md
            nexvary_usim_lab/profiles/K3770.json
          if-no-files-found: error
  windows-exe:
    permissions:
      contents: read
      actions: read
    needs: test
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0 Pillow==11.3.0
      - run: python scripts/create_icon.py
      - name: Compile Windows portable desktop
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NEXVARY-USB-Studio --icon assets/nexvary-usb.ico --hidden-import nexvary_usim_lab.wificall_capabilities --hidden-import nexvary_usim_lab.virtual_sim --hidden-import nexvary_usim_lab.virtual_reader --hidden-import nexvary_usim_lab.reader_diagnostics --hidden-import nexvary_usim_lab.usim_core --hidden-import nexvary_usim_lab.usim_backend --hidden-import nexvary_usim_lab.secure_bridge --add-data "nexvary_usim_lab/profiles;nexvary_usim_lab/profiles" --add-data "docs/THIRD-PARTY-REVIEW.md;docs" --add-data "licenses;licenses" --add-data "assets/fonts;assets/fonts" --add-data "assets/icons;assets/icons" launcher.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: pwsh
        run: "& 'C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe' 'installer/NEXVARY-USB.iss'"
      - name: Download previous 0.3.1 installer for actual upgrade verification
        uses: actions/download-artifact@v4
        with:
          name: NEXVARY-USB-Studio-Windows-Installer
          path: previous-installer/
          run-id: 37854171067
          github-token: ${{ github.token }}
      - name: Install, launch, upgrade, uninstall and settings preservation
        shell: pwsh
        run: ./scripts/windows_package_smoke.ps1
      - name: Versioned files and SHA256
        shell: pwsh
        run: |
          Copy-Item dist/NEXVARY-USB-Studio.exe dist/NEXVARY-USB-Studio-v0.10.1.exe
          Copy-Item installer-output/NEXVARY-USB-Studio-Setup-v0.10.1.exe dist/
          Get-ChildItem dist/*v0.10.1.exe | ForEach-Object { $h = Get-FileHash $_.FullName -Algorithm SHA256; "$($h.Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-USB-Studio-v0.10.1-Windows
          path: |
            dist/*v0.10.1.exe
            dist/SHA256SUMS.txt
            docs/RELEASE-0.10.1-AR.md
            docs/VIRTUAL-SIM-READER-AR.md
            docs/VIRTUAL-SIM-COMPATIBILITY.md
            docs/WIFI-CALL-CAPABILITY-CONTRACT.md
            nexvary_usim_lab/profiles/K3770.json
          if-no-files-found: error

  linux-virtual-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual Linux PC/SC runtime on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y pcscd vsmartcard-vpcd libpcsclite-dev build-essential pkg-config git
          sudo systemctl stop pcscd.socket pcscd.service
          # This is a disposable CI runner, never a user/server preflight.
          if pgrep -x pcscd; then echo "Existing daemon still active; refusing test"; exit 1; fi
          sudo rm -f /run/pcscd/pcscd.comm /run/pcscd/pcscd.pid
          python -m pip install -r requirements-reader.txt
      - name: External PC/SC enumeration and APDU transfer with synthetic modem
        run: |
          bash scripts/linux/build-vpcd-reviewed.sh /tmp/nexvary-vpcd-reviewed
          sudo -E $(which python) scripts/check_virtual_pcsc.py --driver /tmp/nexvary-vpcd-reviewed/libifdvpcd-nexvary-reviewed.so
      - name: Build headless reader source runtime
        run: python scripts/package_linux_reader.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXVARY-Virtual-SIM-Reader-0.10.1-Linux
          path: |
            dist/*Linux*.tar.gz
            virtual-pcsc-evidence.json
            docs/VIRTUAL-SIM-READER-AR.md
          if-no-files-found: error

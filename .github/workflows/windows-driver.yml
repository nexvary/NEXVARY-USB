name: Windows virtual reader driver build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/prepare_windows_vpcd.py
      - scripts/patch_windows_driver_build.py
      - scripts/build_windows_driver.ps1
      - scripts/check_windows_driver_binary.py
      - scripts/check_windows_reader_setup.py
      - scripts/sign_windows_reader_local.ps1
      - scripts/check_windows_local_reader.ps1
      - scripts/check_windows_installed_pcsc.py
      - scripts/check_windows_local_ui.ps1
      - windows/**
      - docs/WINDOWS-PCSC-DRIVER-AR.md
      - .github/workflows/windows-driver.yml
permissions:
  contents: read
jobs:
  build-driver:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare reviewed isolated source
        run: |
          python scripts/prepare_windows_vpcd.py windows-driver-source
          python scripts/patch_windows_driver_build.py windows-driver-source
      - run: python -m pip install -r requirements-reader.txt
      - name: Build x64 UMDF DLL and unsigned catalog
        shell: pwsh
        run: ./scripts/build_windows_driver.ps1
      - name: Corresponding GPL source archive
        if: success()
        shell: pwsh
        run: |
          git -C windows-driver-source diff --binary --output=../driver-output/NEXVARY-PATCH.diff
          Copy-Item docs/WINDOWS-PCSC-DRIVER-AR.md driver-output/README-AR.md
          New-Item -ItemType Directory -Force driver-output/build-scripts | Out-Null
          Copy-Item scripts/*windows_driver*.py,scripts/build_windows_driver.ps1,scripts/prepare_windows_vpcd.py driver-output/build-scripts/
          tar -czf driver-output/vsmartcard-corresponding-source.tar.gz --exclude=.git windows-driver-source
      - name: Sign separate local development package
        shell: pwsh
        run: |
          Copy-Item driver-output local-reader-output -Recurse
          ./scripts/sign_windows_reader_local.ps1 -Output local-reader-output
          Copy-Item scripts/sign_windows_reader_local.ps1,scripts/check_windows_local_reader.ps1 local-reader-output/build-scripts/
          Copy-Item scripts/check_windows_installed_pcsc.py local-reader-output/build-scripts/
      - name: Test local trust, installation, native enumeration and tamper rejection
        shell: pwsh
        run: ./scripts/check_windows_local_reader.ps1 -Output local-reader-output
      - name: Native Arabic approval UI and cancel check
        if: always()
        shell: pwsh
        run: ./scripts/check_windows_local_ui.ps1 -Output local-reader-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXVARY-Windows-Reader-Local-Development-x64
          path: local-reader-output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXVARY-Windows-Virtual-Reader-x64-Development
          path: driver-output/
          if-no-files-found: error

